<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Find your next property</title><style>
:root{font-family:Inter,Segoe UI,Arial,sans-serif;color:#202d41;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}.hero{background:#17283f;color:#fff;padding:52px 22px 100px}.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:1.3rem}.brand-logo{width:32px;height:32px;display:block;object-fit:cover;border-radius:7px;background:#000}.hero-inner,.card{max-width:760px;margin:auto}.eyebrow{font-size:.72rem;letter-spacing:.14em;color:#aebcff;font-weight:700;margin:72px 0 12px}.hero h1{font-size:clamp(2.25rem,7vw,4.25rem);letter-spacing:-.05em;line-height:1.05;margin:0;max-width:620px}.hero p{color:#c1cce0;max-width:500px;line-height:1.6}.card{background:#fff;margin:-54px auto 45px;border:1px solid #e3e9f2;border-radius:14px;padding:28px;box-shadow:0 14px 40px #14254213}.card h2{margin:0 0 7px;font-size:1.35rem}.muted{color:#69758a;font-size:.9rem}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:23px}label{font-size:.83rem;font-weight:600}input,select{display:block;width:100%;margin-top:7px;min-height:45px;border:1px solid #d7dfeb;border-radius:8px;padding:10px 12px;font:inherit;color:#202d41;background:#fff}.full{grid-column:1/-1}.primary{margin-top:24px;border:0;border-radius:8px;padding:13px 17px;background:#405bd8;color:#fff;font:inherit;font-weight:700;cursor:pointer}.primary:hover{background:#3049ba}.notice{min-height:24px;margin:15px 0 0;font-size:.9rem;color:#157652}.notice.error{color:#a22b3d}.honeypot{position:absolute;left:-10000px;opacity:0;pointer-events:none}@media(max-width:600px){.hero{padding-top:30px}.eyebrow{margin-top:54px}.card{margin:-52px 14px 32px;padding:22px}.grid{grid-template-columns:1fr}}
</style><style>
.brand{flex-direction:column;align-items:center;gap:8px;text-align:center}
.brand-logo{width:72px;height:72px}
.brand span{white-space:pre-line;line-height:1.12;font-size:1.55rem}
</style></head><body>
<header class="hero"><div class="hero-inner"><div class="brand"><img class="brand-logo" src="/atlantic-properties-logo.png" alt="Atlantic Properties logo"><span>Atlantic
Properties</span></div><p class="eyebrow">PROPERTY ENQUIRY</p><h1>Find a place that feels right.</h1><p>Tell us what you are looking for. Our property advisor will contact you shortly.</p></div></header>
<main class="card"><h2>Tell us what you need</h2><p class="muted">Choose a property or share your requirements.</p><form id="form"><div class="grid"><label class="full">Property<select id="property"><option value="">Choose a property</option></select></label><label>Your name<input id="name" required autocomplete="name"></label><label>Phone number<input id="phone" required inputmode="tel" autocomplete="tel"></label><label>Email<input id="email" type="email" autocomplete="email"></label><label>Preferred location<input id="location" placeholder="For example, Pune"></label><label>Property type<input id="type" placeholder="Apartment, Villa, Plot…"></label><label>Budget from<input id="min" placeholder="For example, 70 Lakh"></label><label>Budget to<input id="max" placeholder="For example, 90 Lakh"></label><label class="honeypot">Website<input id="website" tabindex="-1" autocomplete="off"></label></div><button class="primary" type="submit">Request a call back</button><p id="notice" class="notice" role="status"></p></form></main>
<script>
const $=id=>document.getElementById(id);let properties=[];
const money=n=>n==null?'':n>=1e7?(n/1e7).toFixed(2).replace(/\.00$/,'')+' Cr':(n/1e5).toFixed(2).replace(/\.00$/,'')+' Lakh';
fetch('/api/public/properties').then(r=>r.json()).then(data=>{properties=data.properties||[];for(const p of properties){const o=document.createElement('option');o.value=p.id;o.textContent=[p.name,p.locality||p.location,money(p.budget_min)||money(p.budget_max)].filter(Boolean).join(' · ');$('property').append(o)}}).catch(()=>{});
$('property').addEventListener('change',()=>{const p=properties.find(x=>x.id===$('property').value);if(!p)return;$('location').value=p.location||'';$('type').value=p.property_type||'';if(p.budget_min)$('min').value=money(p.budget_min);if(p.budget_max)$('max').value=money(p.budget_max)});
$('form').addEventListener('submit',async e=>{e.preventDefault();const notice=$('notice');notice.className='notice';notice.textContent='Sending…';try{const r=await fetch('/api/public/enquiries',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({property_id:$('property').value,name:$('name').value,phone:$('phone').value,email:$('email').value,location:$('location').value,property_type:$('type').value,budget_min:$('min').value,budget_max:$('max').value,website:$('website').value,campaign:new URLSearchParams(location.search).get('campaign')||'meta-ad'})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Please try again.');notice.textContent=d.message;$('form').reset()}catch(err){notice.className='notice error';notice.textContent=err.message}});
</script></body></html>
